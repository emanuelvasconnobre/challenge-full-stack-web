name: mais-a-educacao-challenge
services:
  backend:
    build:
      context: ./api
      dockerfile: Dockerfile.dev
    volumes:
      - ./api/src:/app/src
      - ./api/package.json:/app/package.json
    ports:
      - "8000:8000"
    environment:
      - ENV=development

  db:
    image: postgres:17.6-alpine3.21
    ports:
      - '${DB_SERVER_PORT:-5432}:5432'
    environment:
      POSTGRES_USER: ${DB_USER:-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-strongpassword}
      POSTGRES_DB: ${DB_DATABASE:-mais-a-educacao}
    volumes:
      - mais-a-educacao-db-data:/var/lib/postgresql/data

  backend_prisma_migration:
    build:
      context: ./api
      dockerfile: docker/prisma/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL-postgresql://admin:strongpassword@db:5432/mais-a-educacao}
    depends_on:
      - db
    volumes:
      - ./api/prisma:/app/prisma
    restart: no

  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - ./web:/app
      - ./web/node_modules:/app/node_modules
    environment:
      - NODE_ENV=development

volumes:
  mais-a-educacao-db-data: