name: mais-a-educacao-challenge
services:
  backend:
    build:
      context: ./api
      dockerfile: Dockerfile.dev
    volumes:
      - ./api/src:/app/src
      - ./api/package.json:/app/package.json
    ports:
      - "8000:8000"
    environment:
      - ENV=development

  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - ./web:/app
      - ./web/node_modules:/app/node_modules
    environment:
      - NODE_ENV=development
